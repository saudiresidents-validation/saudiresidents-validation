<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi Resident Validation</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <img src="logo.png" class="logo">

    <h1>Saudi Resident Validation Portal</h1>

    <div class="verified">
        ✔ Verification Successful
    </div>

    <div class="card">

        <div class="row">
            <span>Full Name</span>
            <strong id="name"></strong>
        </div>

        <div class="row">
            <span>Iqama Number</span>
            <strong id="iqama"></strong>
        </div>

        <div class="row">
            <span>Passport Number</span>
            <strong id="passport"></strong>
        </div>

        <div class="row">
            <span>Nationality</span>
            <strong id="nationality"></strong>
        </div>

        <div class="row">
            <span>Profession</span>
            <strong id="profession"></strong>
        </div>

        <div class="row">
            <span>Employer</span>
            <strong id="employer"></strong>
        </div>

        <div class="row">
            <span>Issue Date</span>
            <strong id="issue"></strong>
        </div>

        <div class="row">
            <span>Expiry Date</span>
            <strong id="expiry"></strong>
        </div>

        <div class="row">
            <span>Status</span>
            <strong class="status" id="status"></strong>
        </div>

    </div>

    <img id="residentImage" class="resident-image">

</div>

<script src="script.js"></script>

</body>
</html>
